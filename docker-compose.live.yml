# Live test rig for the log and activity tools. Test-only credentials; loopback ports only.
# Run through scripts/live-test.sh, which also tears the stack down.
name: mysqlmcp-live

x-mysql: &mysql
  restart: "no"
  command:
    - --log-output=TABLE
    - --general-log=1
    - --slow-query-log=1
    - --long-query-time=0
  environment:
    MYSQL_ROOT_PASSWORD: live-test-only-root
  volumes:
    - ./docker/live-init:/docker-entrypoint-initdb.d:ro
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
    interval: 2s
    timeout: 5s
    retries: 60
    start_period: 10s

services:
  mysql84:
    <<: *mysql
    image: mysql:8.4
    ports:
      - "127.0.0.1:13306:3306"

  mysql80:
    <<: *mysql
    image: mysql:8.0
    ports:
      - "127.0.0.1:13307:3306"

  mysql57:
    <<: *mysql
    image: mysql:5.7
    ports:
      - "127.0.0.1:13308:3306"
